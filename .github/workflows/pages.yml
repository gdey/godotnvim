# Builds the Hugo site in site/ and publishes it to GitHub Pages
# (https://gdey.github.io/godotnvim/). The site's documentation pages are the
# repository's README.md, CHANGELOG.md and friends, so it rebuilds when any of
# them change. Needs Settings → Pages → Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "colorscheme/README.md"
      - "docs/**"
      - "addons/godot_nvim/plugin.cfg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a running
# deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --source site --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
