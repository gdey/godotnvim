# Runs the tests on pull requests, on the oldest Neovim the plugin supports
# and on the one the release is tested with. On the godot-4.8 branch it also
# runs on Godot 4.8 (see .github/workflows/sync-godot-4.8.yml on main), on
# pushes there too.
name: Tests

on:
  pull_request:
  push:
    branches: [godot-4.8]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.10.0 is the minimum (inline virtual text, for the swatches and
        # resource icons); keep 0.11.4 in step with release.yml.
        nvim: ["0.10.0", "0.11.4"]
        # Keep the -stable one in step with release.yml.
        godot: ["4.7.1-stable"]
        include:
          # The next Godot release: change it to 4.8-stable once it is out.
          - nvim: "0.11.4"
            godot: "4.8-beta3"
    env:
      GODOT_VERSION: ${{ matrix.godot }}
    name: test (Godot ${{ matrix.godot }}, Neovim ${{ matrix.nvim }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim and Godot
        run: |
          # Builds before 0.10.4 are named nvim-linux64.
          base="https://github.com/neovim/neovim/releases/download/v${{ matrix.nvim }}"
          curl -sSfLo nvim.tar.gz "$base/nvim-linux-x86_64.tar.gz" || curl -sSfLo nvim.tar.gz "$base/nvim-linux64.tar.gz"
          mkdir nvim && tar xzf nvim.tar.gz -C nvim --strip-components=1
          echo "$PWD/nvim/bin" >> "$GITHUB_PATH"
          curl -sSfLo godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          nvim --version | head -1
          "$GODOT" --version
          "$GODOT" --headless --path . --editor --quit
          NVIM=$(command -v nvim) "$GODOT" --headless --path . -s tests/run_tests.gd

      - uses: actions/setup-go@v7
        with:
          go-version-file: colorscheme/go.mod
          cache: false

      - name: Test colorscheme tool
        working-directory: colorscheme
        run: NVIM=$(command -v nvim) go test ./...
