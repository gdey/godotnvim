# Publishes a GitHub release when a version tag (v0.1.0, v1.2.3, ...) is
# pushed. The tag must match the version in addons/godot_nvim/plugin.cfg.
# The release carries the addon (godot_nvim-<version>.zip) and the
# colorscheme tool, vim2godot, built for each platform
# (colorscheme-<version>-<os>-<arch>.tar.gz, .zip on Windows), all with the
# same version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches plugin.cfg
        run: |
          cfg=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godot_nvim/plugin.cfg)
          tag=${GITHUB_REF_NAME#v}
          if [ "$cfg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.cfg version $cfg"
            exit 1
          fi
          echo "VERSION=$cfg" >> "$GITHUB_ENV"

      - name: Install Neovim and Godot
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q neovim
          curl -sSLo godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          "$GODOT" --headless --path . --editor --quit
          NVIM=$(command -v nvim) "$GODOT" --headless --path . -s tests/run_tests.gd

      - uses: actions/setup-go@v7
        with:
          go-version-file: colorscheme/go.mod
          cache: false

      - name: Test colorscheme tool
        working-directory: colorscheme
        run: NVIM=$(command -v nvim) go test ./...

      - name: Build zip
        run: |
          mkdir -p dist
          zip -qr "dist/godot_nvim-${VERSION}.zip" addons/godot_nvim
          unzip -l "dist/godot_nvim-${VERSION}.zip"

      - name: Build colorscheme tool
        working-directory: colorscheme
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="colorscheme-${VERSION}-${os}-${arch}"
            exe=vim2godot
            [ "$os" = windows ] && exe=vim2godot.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "build/$name/$exe" .
            cp README.md ../LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../../dist/$name.zip" "$name")
            else
              tar -C build -czf "../dist/$name.tar.gz" "$name"
            fi
          done
          (cd ../dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: summary, About and Changelog, from CHANGELOG.md and
          # docs/release/about.md (see .github/release-notes.sh).
          .github/release-notes.sh "$VERSION" "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
