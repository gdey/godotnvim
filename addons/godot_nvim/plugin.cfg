[plugin]

name="Neovim Script Editor"
description="Edit GDScript, shaders and text files in an embedded Neovim. Keeps node and file drag-and-drop, the GDScript language server, debugger breakpoints, signal and override signs, the editor's colors and the run shortcuts, and adds format on save and project-wide function search."
author="Gautam Dey"
version="0.2.0"
script="plugin.gd"
